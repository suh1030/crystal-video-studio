name: Render Amethyst five-minute video

on:
  workflow_dispatch:
  push:
    paths:
      - cloud_test/full-render-request.txt

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python packages
        run: python -m pip install --disable-pip-version-check edge-tts pillow requests
      - name: Render video
        run: python cloud_test/cloud_render.py cloud_test/amethyst.json
      - name: Validate output
        run: |
          test -s amethyst-five-minute.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 amethyst-five-minute.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-five-minute-video
          path: amethyst-five-minute.mp4
          retention-days: 30
