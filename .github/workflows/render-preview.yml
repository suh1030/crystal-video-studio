name: Validate Amethyst visuals

on:
  push:
    paths:
      - cloud_test/amethyst.json
      - cloud_test/cloud_render.py
      - .github/workflows/render-preview.yml

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install --disable-pip-version-check edge-tts pillow requests
      - name: Render strict visual preview
        run: python cloud_test/cloud_render.py cloud_test/amethyst.json --preview
      - uses: actions/upload-artifact@v4
        with:
          name: amethyst-visual-preview
          path: amethyst-visual-preview.mp4
          retention-days: 7
