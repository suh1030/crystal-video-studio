<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crystal Video Studio</title>
  <style>
    :root{--bg:#0b090e;--panel:#17141d;--line:#302a37;--text:#f3eff6;--muted:#908897;--violet:#9560c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#251530,transparent 34%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1180px;margin:auto;padding:0 30px}.top{height:82px;border-bottom:1px solid #28232e;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:19px}.brand small{display:block;font-family:inherit;color:#77707e;font-size:9px;letter-spacing:.16em;margin-top:5px}.status{font-size:11px;color:#9e96a5;border:1px solid #332d39;border-radius:99px;padding:8px 12px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;padding:58px 0 42px}.eyebrow{font-size:10px;letter-spacing:.25em;color:#a877cf;font-weight:700}.hero h1{font-family:Georgia,serif;font-size:48px;line-height:1.08;font-weight:400;margin:13px 0}.hero p{color:#9c94a3;line-height:1.7;max-width:620px}.form{display:flex;padding:5px;border:1px solid #352e3e;border-radius:12px;background:#141118;margin-top:28px}.form input{flex:1;background:transparent;border:0;outline:0;color:white;padding:14px;font-size:15px}.form button,.download{border:1px solid #a172c955;background:linear-gradient(135deg,#925dc1,#60348b);border-radius:8px;color:white;padding:0 22px;font-weight:700}.form button:disabled{opacity:.5}.crystal{min-height:275px;position:relative;border:1px solid #2e2635;border-radius:18px;background:radial-gradient(circle,#63368788,transparent 52%),#16101b;overflow:hidden}.crystal i{position:absolute;width:115px;height:220px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);background:linear-gradient(115deg,#45245f,#c28be4 55%,#5c317d);clip-path:polygon(50% 0,100% 27%,80% 100%,10% 100%,0 29%);filter:drop-shadow(0 20px 30px #000)}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:17px;padding-bottom:50px}.panel{background:linear-gradient(145deg,#18151d,#111015);border:1px solid var(--line);border-radius:15px;padding:23px}.panel h2{font-family:Georgia,serif;font-weight:400;margin:0;font-size:22px}.head{display:flex;justify-content:space-between;align-items:center}.percent{font-family:Georgia,serif;color:#ba8cda;font-size:27px}.bar{height:3px;background:#2a2430;margin:18px 0}.bar span{display:block;height:100%;background:linear-gradient(90deg,#633d8c,#bd87dd);transition:.4s}.stages{display:grid;gap:1px}.stage{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid #26212a;opacity:.42}.stage.active,.stage.done{opacity:1}.num{width:28px;height:28px;border:1px solid #403747;border-radius:7px;display:grid;place-items:center;font-size:9px}.active .num{border-color:#9b67c5;color:#c99ae9}.done .num{background:#704b8d;color:white}.stage strong,.stage small{display:block}.stage strong{font-size:12px}.stage small{font-size:9px;color:#817989;margin-top:4px}.stage em{font-style:normal;font-size:9px;color:#8f669f}.console{height:250px;background:#0c0a0e;border-radius:9px;margin-top:17px;padding:15px;overflow:auto;font:10px/1.7 "SFMono-Regular",Consolas,monospace;color:#847b8c}.console p{margin:0}.console p:last-child{color:#c292e1}.result{margin-top:17px;border:1px solid #69497b;background:#27182f;border-radius:11px;padding:17px}.result strong,.result span{display:block}.result span{font-size:9px;letter-spacing:.15em;color:#a97ac8}.result strong{font-family:Georgia,serif;font-weight:400;margin:6px 0 13px}.download{display:inline-flex;height:38px;align-items:center;text-decoration:none;font-size:11px}.note{color:#776f7e;font-size:10px;line-height:1.6;margin-top:17px}@media(max-width:800px){.hero,.grid{grid-template-columns:1fr}.crystal{min-height:230px}.hero h1{font-size:39px}.shell{padding:0 18px}}
  </style>
</head>
<body><div class="shell">
  <header class="top"><div class="brand">Crystal Video Studio<small>LOCAL FIVE-MINUTE VIDEO ENGINE</small></div><div class="status">● Engine ready</div></header>
  <section class="hero"><div><div class="eyebrow">PREMIUM MINERAL STORIES</div><h1>輸入礦石名稱，<br>看著影片一步步完成。</h1><p>自動建立英文腳本、尋找主題水晶素材、產生旁白和單句字幕，最後輸出五分鐘 1080p YouTube 影片。</p><form class="form" id="form"><input id="topic" value="Amethyst" placeholder="例如：Amethyst" aria-label="礦石名稱"><button id="start">開始產生影片</button></form></div><div class="crystal"><i></i></div></section>
  <section class="grid"><article class="panel"><div class="head"><h2>影片產生進度</h2><div class="percent" id="percent">0%</div></div><div class="bar"><span id="bar" style="width:0"></span></div><div class="stages" id="stages"></div></article><aside><article class="panel"><h2>Live process</h2><div class="console" id="logs"><p>Studio ready. Waiting for a crystal name.</p></div><div class="result" id="result" hidden><span>VIDEO COMPLETE</span><strong id="result-title"></strong><a class="download" id="download">下載 MP4</a></div><p class="note">實際運算在你的 Mac 上完成。關閉這個視窗不會取消已開始的工作，但請勿關閉終端機。</p></article></aside></section>
</div><script>
const stageData=[['script','撰寫旁白腳本','本機 AI 生成約 650–700 字'],['facts','內容與節奏檢查','整理句子與五分鐘配速'],['media','搜尋水晶素材','主題礦石優先、白水晶備援'],['voice','產生 AI 旁白','自然女聲與時間同步'],['subtitles','建立單句字幕','小型白字、半透明黑底'],['render','合成 1080p 影片','畫面、音樂、轉場與字幕'],['verify','驗證影片輸出','300 秒、16:9 與檔案完整性']];
const stages=document.querySelector('#stages');stages.innerHTML=stageData.map((s,i)=>`<div class="stage" data-id="${s[0]}"><div class="num">${String(i+1).padStart(2,'0')}</div><div><strong>${s[1]}</strong><small>${s[2]}</small></div><em>等待</em></div>`).join('');
let poll;document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const topic=document.querySelector('#topic').value.trim();if(!topic)return;const btn=document.querySelector('#start');btn.disabled=true;btn.textContent='產生中…';document.querySelector('#result').hidden=true;try{const response=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic})});const job=await response.json();if(!response.ok)throw Error(job.error);poll=setInterval(()=>update(job.id),1200);update(job.id)}catch(err){fail(err.message)}});
async function update(id){try{const r=await fetch('/api/jobs/'+id);const j=await r.json();document.querySelector('#percent').textContent=j.progress+'%';document.querySelector('#bar').style.width=j.progress+'%';document.querySelector('#logs').innerHTML=j.logs.map(x=>`<p>${escapeHtml(x)}</p>`).join('');document.querySelector('#logs').scrollTop=99999;let current=stageData.findIndex(s=>s[0]===j.stage);document.querySelectorAll('.stage').forEach((el,i)=>{el.className='stage '+(j.status==='completed'||i<current?'done':i===current?'active':'');el.querySelector('.num').textContent=j.status==='completed'||i<current?'✓':String(i+1).padStart(2,'0');el.querySelector('em').textContent=j.status==='completed'||i<current?'完成':i===current?'處理中':'等待'});if(j.status==='completed'){clearInterval(poll);document.querySelector('#result').hidden=false;document.querySelector('#result-title').textContent=j.topic+' — A Mineral Story';document.querySelector('#download').href='/api/output/'+j.id;done()}if(j.status==='failed'){clearInterval(poll);fail(j.error)}}catch(err){clearInterval(poll);fail(err.message)}}
function done(){const b=document.querySelector('#start');b.disabled=false;b.textContent='產生另一支影片'}function fail(message){const b=document.querySelector('#start');b.disabled=false;b.textContent='重新嘗試';document.querySelector('#logs').innerHTML+=`<p>Error: ${escapeHtml(message)}</p>`}function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
</script></body></html>
